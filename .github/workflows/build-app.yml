name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Copy web files
        run: |
          mkdir -p /tmp/www
          rsync -a --exclude='.git' --exclude='.github' ./ /tmp/www/
          mkdir www
          cp -r /tmp/www/. www/

      - run: npm init -y
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - run: npx cap init "MyApp" com.example.myapp --web-dir www
      - run: npx cap add android
      - run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
